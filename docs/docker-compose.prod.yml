services:
  # Old static site — kept on docs-legacy.davewil.dev for ~30 days as the
  # rollback target. To rollback: move the caddy label below back to
  # docs.davewil.dev and shift docs-hub off it.
  docs:
    image: ghcr.io/davewil/ts-stuff-docs:latest
    container_name: docs
    restart: unless-stopped
    mem_limit: 64m
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    labels:
      caddy: docs-legacy.davewil.dev
      caddy.tls.dns: cloudflare {env.CF_API_TOKEN}
      caddy.reverse_proxy: "{{upstreams 80}}"
    networks:
      - default
      - proxy

  # Promoted: React hub serves docs.davewil.dev (primary). docs-next.davewil.dev
  # is kept as a mirror for ~2 weeks so visual diffs against the new prod URL
  # stay easy. Both hostnames point at the same upstream container — caddy
  # registers two virtual hosts, both routed to port 80.
  docs-hub:
    image: ghcr.io/davewil/ts-stuff-docs-hub:latest
    container_name: docs-hub
    restart: unless-stopped
    mem_limit: 64m
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    labels:
      caddy_0: docs.davewil.dev
      caddy_0.tls.dns: cloudflare {env.CF_API_TOKEN}
      caddy_0.reverse_proxy: "{{upstreams 80}}"
      caddy_1: docs-next.davewil.dev
      caddy_1.tls.dns: cloudflare {env.CF_API_TOKEN}
      caddy_1.reverse_proxy: "{{upstreams 80}}"
    networks:
      - default
      - proxy

networks:
  proxy:
    external: true
