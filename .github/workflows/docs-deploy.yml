name: Docs / Deploy

on:
  push:
    branches: [main]
    paths:
      - "cheatsheets/**"
      - "apps/docs-hub/**"
      - "docs/**"
      - "Dockerfile.docs"
      - "Dockerfile.docs-hub"
      - ".github/workflows/docs-deploy.yml"
      - ".github/workflows/_deploy-docker-service.yml"
      - ".github/smoke/**"
    tags:
      - "docs-v*"
      - "hub-v*"
  pull_request:
    branches: [main]
    paths:
      - "cheatsheets/**"
      - "apps/docs-hub/**"
      - "docs/**"
      - "Dockerfile.docs"
      - "Dockerfile.docs-hub"
      - ".github/workflows/docs-deploy.yml"
      - ".github/workflows/_deploy-docker-service.yml"
      - ".github/smoke/**"
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # QUALITY — static site (production)
  # ─────────────────────────────────────────────────────────────────────
  quality:
    name: Quality (static site)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate HTML with Python html.parser
        run: |
          python3 - <<'PY'
          import sys, pathlib
          from html.parser import HTMLParser

          class StrictParser(HTMLParser):
              def __init__(self, path):
                  super().__init__(convert_charrefs=True)
                  self.path = path
                  self.errors = []

              def error(self, message):
                  self.errors.append(message)

          fail = False
          for p in sorted(pathlib.Path("cheatsheets").glob("*.html")):
              parser = StrictParser(p)
              try:
                  parser.feed(p.read_text(encoding="utf-8"))
                  parser.close()
              except Exception as e:
                  print(f"FAIL {p}: {e}")
                  fail = True
                  continue
              if parser.errors:
                  print(f"FAIL {p}: {parser.errors}")
                  fail = True
              else:
                  print(f"OK   {p}")
          sys.exit(1 if fail else 0)
          PY

      - name: Verify expected files are present
        run: |
          set -e
          required=(
            "cheatsheets/index.html"
            "cheatsheets/cheatsheets-index.html"
            "cheatsheets/event-loop-index.html"
            "cheatsheets/typescript-cheatsheet.html"
            "cheatsheets/curl-cheatsheet.html"
            "cheatsheets/js-q-explainer.html"
            "cheatsheets/js-q-2-explainer.html"
            "cheatsheets/await-explainer.html"
            "cheatsheets/styles.css"
            "cheatsheets/app.js"
            "cheatsheets/wallpaper-engine.js"
            "cheatsheets/tweaks.js"
          )
          for f in "${required[@]}"; do
            test -f "$f" || { echo "MISSING: $f"; exit 1; }
          done
          echo "All expected files present."

      - name: Smoke test image locally
        run: |
          docker build -f Dockerfile.docs -t docs-smoke:local .
          docker run -d --name docs-smoke -p 18080:80 docs-smoke:local
          for i in $(seq 1 10); do
            curl -sf http://localhost:18080/health >/dev/null && break
            sleep 1
          done
          fail=0
          # Path list shared with the deploy job — drift impossible.
          while IFS= read -r path; do
            case "$path" in ''|\#*) continue ;; esac
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:18080/$path")
            if [ "$code" = "200" ]; then
              echo "200  /$path"
            else
              echo "FAIL $code /$path"
              fail=1
            fi
          done < .github/smoke/docs.txt
          docker logs docs-smoke || true
          docker rm -f docs-smoke
          exit $fail

  # ─────────────────────────────────────────────────────────────────────
  # QUALITY — docs hub (React preview)
  # ─────────────────────────────────────────────────────────────────────
  quality-hub:
    name: Quality (docs hub)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify expected hub files are present
        run: |
          set -e
          required=(
            "apps/docs-hub/index.html"
            "apps/docs-hub/site.css"
            "apps/docs-hub/data.js"
            "apps/docs-hub/app.jsx"
            "apps/docs-hub/views.jsx"
            "apps/docs-hub/tweaks-panel.jsx"
            "apps/docs-hub/wallpapers.jsx"
            "Dockerfile.docs-hub"
          )
          for f in "${required[@]}"; do
            test -f "$f" || { echo "MISSING: $f"; exit 1; }
          done
          echo "All expected hub files present."

      - name: Sanity-check JSX & data.js syntactically via node
        run: |
          # Strip the JSX-specific bits we can't parse without Babel, but
          # at least catch unterminated strings / mismatched braces in data.js.
          node -e "require('fs').readFileSync('apps/docs-hub/data.js', 'utf8')"
          # data.js sets window.DOMAINS / TOPICS / STATUSES — make sure they all exist.
          grep -q "^window.DOMAINS"   apps/docs-hub/data.js
          grep -q "^window.TOPICS"    apps/docs-hub/data.js
          grep -q "^window.STATUSES"  apps/docs-hub/data.js
          # JSX files: simple grep for the React calls we depend on.
          grep -q "ReactDOM.createRoot" apps/docs-hub/app.jsx
          grep -q "AtlasView"    apps/docs-hub/views.jsx
          grep -q "TerminalView" apps/docs-hub/views.jsx
          grep -q "ZineView"     apps/docs-hub/views.jsx
          grep -q "IdeView"      apps/docs-hub/views.jsx
          echo "Hub source sanity checks passed."

      - name: Smoke test hub image locally
        run: |
          docker build -f Dockerfile.docs-hub -t docs-hub-smoke:local .
          docker run -d --name docs-hub-smoke -p 18081:80 docs-hub-smoke:local
          for i in $(seq 1 10); do
            curl -sf http://localhost:18081/health >/dev/null && break
            sleep 1
          done
          fail=0
          # Path list shared with the deploy-hub job — drift impossible.
          # Covers root files, /cheatsheets/* nested paths, and legacy
          # root paths that nginx rewrites into /cheatsheets/X.html.
          while IFS= read -r path; do
            case "$path" in ''|\#*) continue ;; esac
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:18081/$path")
            if [ "$code" = "200" ]; then
              echo "200  /$path"
            else
              echo "FAIL $code /$path"
              fail=1
            fi
          done < .github/smoke/docs-hub.txt
          docker logs docs-hub-smoke || true
          docker rm -f docs-hub-smoke
          exit $fail

  # ─────────────────────────────────────────────────────────────────────
  # DEPLOY — static site (docs.davewil.dev) — gated on docs-v* tag
  # ─────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy (static site)
    needs: quality
    if: startsWith(github.ref, 'refs/tags/docs-v')
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_deploy-docker-service.yml
    secrets: inherit
    with:
      image: ghcr.io/davewil/ts-stuff-docs
      dockerfile: Dockerfile.docs
      service: docs
      smoke-paths-file: .github/smoke/docs.txt

  # ─────────────────────────────────────────────────────────────────────
  # DEPLOY — docs hub (docs-next.davewil.dev) — gated on hub-v* tag
  # ─────────────────────────────────────────────────────────────────────
  # recreate-all is true so Caddy label changes on sibling services
  # (e.g. promotion → docs-legacy.davewil.dev) propagate — not just the
  # new hub image. Legacy root paths (event-loop-index.html etc.) are
  # nginx-rewritten to /cheatsheets/X.html; smoke-tested here so any
  # already-shared deep link keeps working.
  deploy-hub:
    name: Deploy (docs hub)
    needs: quality-hub
    if: startsWith(github.ref, 'refs/tags/hub-v')
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_deploy-docker-service.yml
    secrets: inherit
    with:
      image: ghcr.io/davewil/ts-stuff-docs-hub
      dockerfile: Dockerfile.docs-hub
      service: docs-hub
      recreate-all: true
      smoke-paths-file: .github/smoke/docs-hub.txt
