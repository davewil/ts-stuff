services:
  app:
    build:
      context: .
      target: runtime
    image: node-ts-test:dev
    container_name: node-ts-test-app
    ports:
      - "3003:3003"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3003
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3003/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  test:
    build:
      context: .
      target: test
    image: node-ts-test:test
    container_name: node-ts-test-vitest
    profiles: ["test"]
    environment:
      CI: "true"
