name: Docs / Deploy

on:
  push:
    branches: [main]
    paths:
      - "cheatsheets/**"
      - "docs/**"
      - "Dockerfile.docs"
      - ".github/workflows/docs-deploy.yml"
    tags: ["docs-v*"]
  pull_request:
    branches: [main]
    paths:
      - "cheatsheets/**"
      - "docs/**"
      - "Dockerfile.docs"
      - ".github/workflows/docs-deploy.yml"
  workflow_dispatch:

jobs:
  quality:
    name: Quality (validate HTML)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate HTML with Python html.parser
        run: |
          python3 - <<'PY'
          import sys, pathlib
          from html.parser import HTMLParser

          class StrictParser(HTMLParser):
              def __init__(self, path):
                  super().__init__(convert_charrefs=True)
                  self.path = path
                  self.errors = []

              def error(self, message):
                  self.errors.append(message)

          fail = False
          for p in sorted(pathlib.Path("cheatsheets").glob("*.html")):
              parser = StrictParser(p)
              try:
                  parser.feed(p.read_text(encoding="utf-8"))
                  parser.close()
              except Exception as e:
                  print(f"FAIL {p}: {e}")
                  fail = True
                  continue
              if parser.errors:
                  print(f"FAIL {p}: {parser.errors}")
                  fail = True
              else:
                  print(f"OK   {p}")
          sys.exit(1 if fail else 0)
          PY

      - name: Verify expected files are present
        run: |
          set -e
          required=(
            "cheatsheets/index.html"
            "cheatsheets/cheatsheets-index.html"
            "cheatsheets/event-loop-index.html"
            "cheatsheets/typescript-cheatsheet.html"
            "cheatsheets/curl-cheatsheet.html"
            "cheatsheets/js-q-explainer.html"
            "cheatsheets/js-q-2-explainer.html"
            "cheatsheets/await-explainer.html"
            "cheatsheets/styles.css"
            "cheatsheets/app.js"
          )
          for f in "${required[@]}"; do
            test -f "$f" || { echo "MISSING: $f"; exit 1; }
          done
          echo "All expected files present."

      - name: Smoke test image locally
        run: |
          docker build -f Dockerfile.docs -t docs-smoke:local .
          docker run -d --name docs-smoke -p 18080:80 docs-smoke:local
          for i in $(seq 1 10); do
            curl -sf http://localhost:18080/health >/dev/null && break
            sleep 1
          done
          fail=0
          for f in index.html cheatsheets-index.html event-loop-index.html \
                   typescript-cheatsheet.html curl-cheatsheet.html \
                   js-q-explainer.html js-q-2-explainer.html await-explainer.html \
                   styles.css app.js; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:18080/$f")
            if [ "$code" = "200" ]; then
              echo "200  /$f"
            else
              echo "FAIL $code /$f"
              fail=1
            fi
          done
          docker logs docs-smoke || true
          docker rm -f docs-smoke
          exit $fail

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: quality
    if: startsWith(github.ref, 'refs/tags/docs-v')
    permissions:
      contents: read
      packages: write

    env:
      IMAGE: ghcr.io/davewil/ts-stuff-docs

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version tag
        id: meta
        env:
          REF: ${{ github.ref }}
        run: |
          version="${REF#refs/tags/}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.docs
          push: true
          tags: |
            ghcr.io/davewil/ts-stuff-docs:latest
            ghcr.io/davewil/ts-stuff-docs:${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_AUTHKEY }}
          tags: tag:ci

      - name: Write SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Copy compose file to host
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          ssh "root@$DEPLOY_HOST" "mkdir -p /root/docs"
          scp docs/docker-compose.prod.yml "root@$DEPLOY_HOST:/root/docs/docker-compose.prod.yml"

      - name: Ensure GHCR auth on host
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! ssh "root@$DEPLOY_HOST" "docker pull $IMAGE:latest --quiet" 2>/dev/null; then
            printf '%s' "$GHCR_TOKEN" | ssh "root@$DEPLOY_HOST" "docker login ghcr.io -u $GHCR_USER --password-stdin"
          fi

      - name: Deploy and smoke test
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          ssh -o StrictHostKeyChecking=accept-new "root@$DEPLOY_HOST" bash -s <<'EOF'
            set -e
            cd /root/docs

            echo "Pulling latest image..."
            docker compose -f docker-compose.prod.yml pull docs

            echo "Recreating container..."
            docker compose -f docker-compose.prod.yml up -d --force-recreate --no-build docs

            echo "Waiting for health..."
            for i in $(seq 1 20); do
              if docker compose -f docker-compose.prod.yml exec -T docs wget -qO- http://localhost/health 2>/dev/null | grep -q ok; then
                echo "docs healthy after ${i}s"
                break
              fi
              sleep 1
            done

            echo "=== Smoke test ==="
            fail=0
            for f in index.html cheatsheets-index.html event-loop-index.html \
                     typescript-cheatsheet.html curl-cheatsheet.html \
                     js-q-explainer.html js-q-2-explainer.html await-explainer.html \
                     styles.css app.js; do
              code=$(docker compose -f docker-compose.prod.yml exec -T docs wget -S -qO /dev/null "http://localhost/$f" 2>&1 | awk '/HTTP\//{print $2; exit}')
              if [ "$code" = "200" ]; then
                echo "200  /$f"
              else
                echo "FAIL $code /$f"
                fail=1
              fi
            done

            echo "=== Container status ==="
            docker compose -f docker-compose.prod.yml ps

            docker image prune -f >/dev/null 2>&1 || true

            if [ "$fail" = "1" ]; then
              echo "Deploy smoke test failed."
              exit 1
            fi

            echo "Deploy complete."
          EOF
