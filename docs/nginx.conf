server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hide nginx version
    server_tokens off;

    # No directory listings
    autoindex off;

    # Gzip — cheap win for HTML/CSS/JS
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # NOTE: nginx's `add_header` inheritance is all-or-nothing — defining any
    # add_header inside a `location` discards every add_header from the parent
    # `server` block. So security headers are repeated in each location below
    # rather than declared once at server scope.

    # HTML: revalidate every request (small files; freshness > bandwidth).
    # try_files is explicit here so a miss falls through to the legacy-URL
    # rewrite at the bottom — regex location blocks bypass `location /` and
    # would otherwise hard-404 before the rewrite gets a chance.
    location ~* \.html$ {
        try_files $uri @cheatsheet_fallback;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    }

    # CSS/JS/JSX: 1h cache (no fingerprinting yet — keep short).
    # .jsx is included for the docs-hub image; harmless in the static image.
    # try_files for the same reason as the html block above.
    location ~* \.(css|js|jsx)$ {
        try_files $uri @cheatsheet_fallback;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    }

    # Default: try the file, then index, then fall back to /cheatsheets/$uri so
    # old root-level deep links (event-loop-index.html, typescript-cheatsheet.html,
    # etc) keep resolving after the hub promotion that nests them under
    # /cheatsheets/. Server-side rewrite — URL bar stays as the visitor's link.
    # In the static image, /cheatsheets/ doesn't exist as a directory, so the
    # fallback just 404s like before; no behavioural change there.
    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        try_files $uri $uri/ @cheatsheet_fallback;
    }

    location @cheatsheet_fallback {
        # Negative lookahead: only rewrite URIs not already under /cheatsheets/.
        # Without this, /cheatsheets/missing.html would 404 → rewrite to
        # /cheatsheets/cheatsheets/missing.html → 404 → rewrite again → ...
        # nginx would short-circuit at 10 cycles with a 500.
        rewrite ^/(?!cheatsheets/)(.+)$ /cheatsheets/$1 last;
        return 404;
    }

    # Health endpoint for compose/Caddy probes
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
